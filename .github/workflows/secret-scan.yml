# Sisplo — varredura de segredos.
#
# Mora em Sisplo/.github e é imposto a todos os repositórios da organização
# pela regra "Require workflows to pass before merging" do ruleset
# "CI obrigatório — varredura de segredos".
#
# Não usamos a gitleaks-action: desde a v2 ela é licenciada sob EULA comercial
# e exige chave GITLEAKS_LICENSE em contas de organização. O binário gitleaks
# é MIT e faz exatamente a mesma detecção — então baixamos o binário direto,
# com verificação de checksum. Mesmo motivo vale para o TruffleHog: binário
# standalone, nunca Action de terceiro nem instalador de branch móvel.
#
# Para atualizar a versão: https://github.com/gitleaks/gitleaks/releases
name: Varredura de segredos

on:
  workflow_call:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

env:
  GITLEAKS_VERSAO: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks (histórico completo)
    runs-on: ubuntu-latest
    steps:
      # A organização exige action de terceiro fixada por SHA: tag é móvel e pode ser
      # reapontada depois da revisão. O comentário ao lado diz qual release é.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (MIT), com checksum
        run: |
          set -euo pipefail
          V="${GITLEAKS_VERSAO}"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o gitleaks.tar.gz "${BASE}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt  "${BASE}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" checksums.txt \
            | sed "s| gitleaks_${V}_linux_x64.tar.gz| gitleaks.tar.gz|" \
            | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact é obrigatório: sem ele o segredo encontrado aparece em claro
      # no log do Actions, que é um segundo vazamento.
      - name: Varrer todo o histórico
        run: gitleaks git --redact --exit-code 1 --log-opts="--all"

  trufflehog:
    name: TruffleHog (credenciais vivas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Binário do release com sha256 fixado, no lugar de `curl | sh` de um instalador
      # servido pelo branch `main`: aquele caminho executa código de terceiro que pode
      # mudar entre dois runs, sem nada para conferir. Versão e hash são os mesmos já
      # verificados e em uso no `security.yml` do sisplo-erp.
      - name: Instalar TruffleHog
        env:
          TRUFFLEHOG_VERSAO: "3.97.2"
          TRUFFLEHOG_SHA256: "6a767a0ae95ba0c51628b37a6bb938765be17b9b6d7ad8b9a810da56f63656c1"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --proto '=https' --proto-redir '=https' \
            -o trufflehog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSAO}/trufflehog_${TRUFFLEHOG_VERSAO}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  trufflehog.tar.gz" | sha256sum --check --strict
          tar -xzf trufflehog.tar.gz trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      # 'verified' = a credencial foi testada contra a API do provedor e ESTÁ VIVA.
      # É o achado que exige rotação imediata, não triagem.
      #
      # ⚠️ A saída do TruffleHog NUNCA redige a credencial — o campo `Raw` vem em texto
      # puro, ao contrário do gitleaks, que tem `--redact`. Imprimir o resultado colaria
      # a credencial AINDA VÁLIDA no log do Actions bem no momento em que o gate dispara:
      # um segundo vazamento, causado pela detecção do primeiro. Por isso o JSON vai para
      # um arquivo que nunca é impresso nem sobe como artefato, e só campo seguro
      # (detector, arquivo, linha, commit) chega ao log.
      - name: Procurar credenciais vivas
        run: |
          set +e
          trufflehog git file://. --results=verified --json --fail --no-update > trufflehog-resultado.json
          codigo_saida=$?
          set -e
          if [ "$codigo_saida" -ne 0 ]; then
            echo "::error::TruffleHog achou credencial verificada e AINDA VÁLIDA — rotacione/revogue antes de mergear. Detalhe (sem o valor, de propósito):"
            python3 - trufflehog-resultado.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              for linha in f:
                  linha = linha.strip()
                  if not linha:
                      continue
                  achado = json.loads(linha)
                  git = achado.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
                  commit = git.get("commit", "")[:7]
                  print(f"- {achado.get('DetectorName')}: {git.get('file')}:{git.get('line')} (commit {commit})")
          PY
          fi
          rm -f trufflehog-resultado.json
          exit "$codigo_saida"
