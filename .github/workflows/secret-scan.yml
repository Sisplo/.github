# Sisplo — varredura de segredos, exigida pela organização.
#
# Mora em Sisplo/.github e é imposto a todos os repositórios pela regra
# "Require workflows to pass before merging" do ruleset "CI obrigatório —
# varredura de segredos". É o que garante a varredura em repositório que NÃO
# tem caller próprio: sem ele, quem não herdou o template fica sem cerca.
#
# ⚠️ Este arquivo é FINO de propósito: toda a lógica vive em `gitleaks.yml`
# deste mesmo repositório, que é a fonte única. Duplicar a lógica aqui foi
# tentado e desfeito — dois arquivos fazendo a mesma varredura divergem, e o
# que ficou para trás foi justamente o mais cuidadoso dos dois.
#
# Referenciado por TAG (@v1), não por SHA nem por @main: SHA é para action de
# terceiro, e @main faria todo merge neste repositório mudar o portão de todos
# os repositórios da organização sem momento de revisão.
name: Varredura de segredos

on:
  # `workflow_call` fica: o obrigatório da organização precisa ser chamável também como
  # reusável, e tirá-lo quebraria quem já o chame assim.
  workflow_call:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  varredura:
    uses: Sisplo/.github/.github/workflows/gitleaks.yml@v1
