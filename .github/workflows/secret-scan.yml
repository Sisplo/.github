# Sisplo — varredura de segredos, exigida pela organização.
#
# Mora em Sisplo/.github e é imposto a todos os repositórios pela regra
# "Require workflows to pass before merging" do ruleset "CI obrigatório —
# varredura de segredos". É o que garante a varredura em repositório que NÃO
# tem caller próprio: sem ele, quem não herdou o template fica sem cerca.
#
# ⚠️ Este arquivo é FINO de propósito: toda a lógica vive em `gitleaks.yml`
# deste mesmo repositório, que é a fonte única. Duplicar a lógica aqui foi
# tentado e desfeito — dois arquivos fazendo a mesma varredura divergem, e o
# que ficou para trás foi justamente o mais cuidadoso dos dois.
#
# ⚠️ Referencia o reusável por `@main`, e NÃO por tag — o oposto do que vale para o caller
# de cada repo. O motivo é medido, não estético: o ruleset da organização exige ESTE arquivo
# em `refs/heads/main` deste repositório. O portão já é a `main`, então pinar a chamada
# interna numa tag só cria uma segunda versão, atrasada, dentro do mesmo arquivo que a `main`
# já serve. Com `@v1` e a tag onde ela está hoje (`6ff80d47`, anterior à PR #7), este
# workflow chamaria o reusável SEM TruffleHog e SEM `--log-opts=--all`: a varredura da
# organização inteira encolheria, em silêncio, no instante do merge.
#
# O caller por repositório continua em `@v1`: lá a tag é o momento de revisão, e o Dependabot
# propõe o bump. Aqui não há o que revisar depois — o merge nesta `main` JÁ é o gate.
name: Varredura de segredos

on:
  # `workflow_call` fica: o obrigatório da organização precisa ser chamável também como
  # reusável, e tirá-lo quebraria quem já o chame assim.
  workflow_call:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  varredura:
    uses: Sisplo/.github/.github/workflows/gitleaks.yml@main
