# Sisplo — varredura de segredos, exigida pela organização.
#
# Mora em Sisplo/.github e é imposto a todos os repositórios pela regra
# "Require workflows to pass before merging" do ruleset "CI obrigatório —
# varredura de segredos". É o que garante a varredura em repositório que NÃO
# tem caller próprio: sem ele, quem não herdou o template fica sem cerca.
#
# ⚠️ Este arquivo é FINO de propósito: toda a lógica vive nos reusáveis deste
# mesmo repositório — `gitleaks.yml` (segredo) e `interpolacao-em-run.yml`
# (SEG-CD-02) —, cada um a fonte única da sua cerca. Duplicar a lógica aqui foi
# tentado e desfeito — dois arquivos fazendo a mesma varredura divergem, e o
# que ficou para trás foi justamente o mais cuidadoso dos dois.
#
# ⚠️ Referencia os reusáveis por `@main`, e NÃO por tag — o oposto do que vale para o caller
# de cada repo. O motivo é medido, não estético: o ruleset da organização exige ESTE arquivo
# em `refs/heads/main` deste repositório. O portão já é a `main`, então pinar a chamada
# interna numa tag só cria uma segunda versão, atrasada, dentro do mesmo arquivo que a `main`
# já serve. Medido em 14/09/2026: a `v1` serve `bace68f5` (PR #8), e ali o
# `interpolacao-em-run.yml` NEM EXISTE — chamá-lo por `@v1` reprovaria por arquivo ausente.
# O precedente anterior era pior porque calava: com a `v1` em `6ff80d47`, este workflow
# chamaria o gitleaks SEM TruffleHog e SEM `--log-opts=--all`, e a varredura da organização
# encolheria, em silêncio, no instante do merge.
#
# O caller por repositório continua em `@v1`: lá a tag é o momento de revisão, e o Dependabot
# propõe o bump. Aqui não há o que revisar depois — o merge nesta `main` JÁ é o gate.
name: Varredura de segredos

on:
  # `workflow_call` fica: o obrigatório da organização precisa ser chamável também como
  # reusável, e tirá-lo quebraria quem já o chame assim.
  workflow_call:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  varredura:
    uses: Sisplo/.github/.github/workflows/gitleaks.yml@main

  # A cerca SEG-CD-02 — interpolação de contexto controlável dentro de `run:`. Entra como job
  # SEPARADO, e não como passo dentro do `gitleaks.yml`: assim quem chama `gitleaks.yml@v1`
  # continua chamando só a varredura de segredo, e nenhuma das duas cercas fica refém da falha
  # da outra. O ruleset exige o WORKFLOW, não o nome do contexto, então job novo aqui vale sem
  # recadastrar nada.
  #
  # 🚨 É ESTE caminho que fecha o furo de arquitetura do SEG-CD-02 (sisplo-erp, ESTADO §1ew): a
  # cerca local do repo consumidor vem da própria PR, que pode trocá-la por `true` e passar
  # verde. Aqui o inspetor é imposto pela organização e a PR não o alcança.
  interpolacao:
    uses: Sisplo/.github/.github/workflows/interpolacao-em-run.yml@main
