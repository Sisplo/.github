name: aviso-pr-slack (reusable)

# Reusable workflow chamado pelo caller local de cada repo. Substitui o modo "pr" do hook
# local do Claude Code (claude-dotfiles/claude/hooks/slack-notify.sh), que só dispara com uma
# sessão aberta na hora do `gh pr create`/`gh pr merge` — este workflow dispara sempre,
# de qualquer origem do PR. plano-fluxo-agentes.md e Turnaq/docs/pendencias.md, P-25, item 1.
#
# Autenticação no Infisical por OIDC (sem credencial armazenada no GitHub): a Action troca o
# token OIDC da própria execução por uma sessão do Infisical, contra uma machine identity
# configurada para confiar no emissor do GitHub Actions. `INFISICAL_SLACK_IDENTITY_ID` é um ID,
# não segredo — vive como variável de organização (Settings → Secrets and variables →
# Actions → Variables), não como secret.
#
# Referenciado por TAG (@v1) no caller, não por SHA: é workflow da própria casa, e a tag deixa
# o Dependabot (ecossistema github-actions) propor o bump — plano-fluxo-agentes.md §4/§5.

on:
  workflow_call:
    inputs:
      channel:
        description: "Canal Slack do repo (ex.: #turnaq), de ops/integracoes.yaml"
        required: true
        type: string
      infisical-project-slug:
        description: "Slug do projeto Infisical do repo, de ops/integracoes.yaml"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  aviso:
    # só dispara em abertura e em fechamento por merge — nunca em fechamento sem merge
    if: github.event.action == 'opened' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # exigido pela troca OIDC com o Infisical
      pull-requests: read
    steps:
      - name: Busca o token do bot no Infisical (OIDC, sem segredo armazenado)
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          identity-id: ${{ vars.INFISICAL_SLACK_IDENTITY_ID }}
          project-slug: ${{ inputs.infisical-project-slug }}
          env-slug: "dev"
          secret-path: "/"

      - name: Monta a mensagem
        id: msg
        # Título e URL do PR são texto de terceiro (quem abre a PR escolhe o título) —
        # passam por variável de ambiente, nunca interpolados direto no script (actionlint
        # "expression", risco de injeção de comando via título malicioso).
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$PR_ACTION" = "opened" ]; then
            EVENTO="aberto"
          else
            EVENTO="mergeado"
          fi
          {
            echo "texto=:github: PR *${EVENTO}* em \`${PR_REPO}\`: <${PR_URL}|#${PR_NUMBER} ${PR_TITLE}>"
          } >> "$GITHUB_OUTPUT"

      - name: Posta no Slack
        # SLACK_BOT_TOKEN chega como variável de ambiente do passo anterior
        # (Infisical/secrets-action, export-type "env", default — sob o próprio nome do
        # segredo no Infisical, sem passar pelo YAML nem por um output do job).
        run: |
          curl -sS --max-time 5 -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg ch "${{ inputs.channel }}" --arg tx "${{ steps.msg.outputs.texto }}" '{channel:$ch, text:$tx}')"
